# Snap Studio release: macOS (universal), Windows and Linux.
#
# Manual trigger only, by `scripts/release.sh` (or the "Run workflow" button
# of the Actions tab).
#
# Version: the one of src-tauri/tauri.conf.json, bumped and committed by
# `scripts/release.sh` before the start. The workflow refuses a version
# already published.
#
# Updates: packages are signed with the key from the secrets
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and the
# release carries `latest.json`, which the installed app reads.

name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version src-tauri/tauri.conf.json)
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::v$v is already published: run scripts/release.sh, which bumps the version."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The referenced slicing engine must be published.
          if [ -f src-tauri/engine.json ]; then
            for url in $(jq -r '.platforms[].url' src-tauri/engine.json); do
              curl -sfIL -o /dev/null "$url" || { echo "::error::Engine not found: $url (scripts/engine.sh)"; exit 1; }
            done
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Update packages enabled here only: a local build, without a signing
      # key, stays possible.
      - name: Build
        working-directory: src-tauri
        run: |
          npx --yes @tauri-apps/cli@^2 build ${{ matrix.args }} \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Packages (macOS)
        if: runner.os == 'macOS'
        run: |
          b=src-tauri/target/universal-apple-darwin/release/bundle
          n="Snap-Studio_${VERSION}_macos-universal"
          mkdir -p dist
          cp "$b"/dmg/*.dmg "dist/$n.dmg"
          cp "$b/macos/Snap Studio.app.tar.gz" "dist/$n.app.tar.gz"
          cp "$b/macos/Snap Studio.app.tar.gz.sig" "dist/$n.app.tar.gz.sig"

      - name: Packages (Windows)
        if: runner.os == 'Windows'
        run: |
          b=src-tauri/target/release/bundle/nsis
          n="Snap-Studio_${VERSION}_x64-setup.exe"
          mkdir -p dist
          cp "$b"/*-setup.exe "dist/$n"
          cp "$b"/*-setup.exe.sig "dist/$n.sig"

      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          b=src-tauri/target/release/bundle
          n="Snap-Studio_${VERSION}_amd64"
          mkdir -p dist
          cp "$b"/deb/*.deb "dist/$n.deb"
          cp "$b"/appimage/*.AppImage "dist/$n.AppImage"
          cp "$b"/appimage/*.AppImage.sig "dist/$n.AppImage.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: snap-studio-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Notes: the commits since the previous release.
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log "$prev..HEAD" --no-merges --format='- %s' > notes.md
          else
            git log -20 --no-merges --format='- %s' > notes.md
          fi
          [ -s notes.md ] || echo "- Reconstruction sans changement" > notes.md
          cat notes.md

      # File read by the installed app: one entry per platform, with the
      # package's URL and its signature.
      - name: latest.json
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          mac="Snap-Studio_${VERSION}_macos-universal.app.tar.gz"
          win="Snap-Studio_${VERSION}_x64-setup.exe"
          lin="Snap-Studio_${VERSION}_amd64.AppImage"
          jq -n \
            --arg v "$VERSION" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mu "$base/$mac" --rawfile ms "dist/$mac.sig" \
            --arg wu "$base/$win" --rawfile ws "dist/$win.sig" \
            --arg lu "$base/$lin" --rawfile ls "dist/$lin.sig" \
            '{
              version: $v,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { url: $mu, signature: $ms },
                "darwin-x86_64":  { url: $mu, signature: $ms },
                "windows-x86_64": { url: $wu, signature: $ws },
                "linux-x86_64":   { url: $lu, signature: $ls }
              }
            }' > dist/latest.json
          cat dist/latest.json

      - name: Release
        run: |
          gh release create "v$VERSION" $(ls dist/* | grep -v '\.sig$') \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Snap Studio $VERSION" \
            --notes-file notes.md
