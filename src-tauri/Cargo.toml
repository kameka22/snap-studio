[package]
name = "snap-studio"
version = "0.1.0"
edition = "2021"
description = "Explorateur de fichiers 3MF avec previsualisation"
authors = ["Laurent Carlini"]

[lib]
name = "snap_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
trash = "5"
walkdir = "2"
anyhow = "1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
libc = "0.2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
portable-pty = "0.9.0"
notify = "8.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
