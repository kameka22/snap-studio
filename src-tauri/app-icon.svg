<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icône de Snap Studio : la Snapmaker U1 de l'écran Imprimantes, posée sur
       un carré arrondi en dégradé (grille d'icône macOS : 824 px, rayon 185).
       Source de `tauri icon` ; les couleurs sont figées, sans CSS. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9dff" />
      <stop offset="1" stop-color="#0b46c4" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28" />
    </filter>
    <linearGradient id="pvFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#dfe3ec" />
    </linearGradient>
    <linearGradient id="pvLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ebf2" /><stop offset="1" stop-color="#c6cbd8" />
    </linearGradient>
    <radialGradient id="pvAct">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#9fd0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- fond -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" />
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.12" />

  <!-- imprimante : repère 280 × 252 de l'illustration, agrandi 2,3 fois -->
  <g transform="translate(190 222) scale(2.3)">
    <ellipse cx="140" cy="228" rx="96" ry="9" fill="#001a4d" fill-opacity="0.35" />

