<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Snap Studio icon: "U1" on a graphite rounded square (macOS icon grid:
       824 px, radius 185). The U runs through the colors of the U1's four
       heads, the 1 is white. Letters are stroked paths, no font: the icon
       renders the same everywhere. Source of `tauri icon`. -->
<defs>
<filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
</filter>
<radialGradient id="sheen" cx="0.5" cy="0" r="0.9">
<stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3a3a3c"/>
<stop offset="1" stop-color="#121214"/>
</linearGradient>
<linearGradient id="heads" gradientUnits="userSpaceOnUse" x1="210" y1="0" x2="580" y2="0">
<stop offset="0" stop-color="#ff453a"/>
<stop offset="0.36" stop-color="#ffd60a"/>
<stop offset="0.66" stop-color="#30d158"/>
<stop offset="1" stop-color="#0a84ff"/>
</linearGradient>
</defs>
<g filter="url(#drop)">
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
</g>
<path d="M 267 330 V 555 a 125 125 0 0 0 250 0 V 330" fill="none" stroke="url(#heads)" stroke-width="118" stroke-linecap="round" stroke-linejoin="round" />
<path d="M 672 405 L 757 330 V 700" fill="none" stroke="#fff" stroke-width="118" stroke-linecap="round" stroke-linejoin="round" />
</svg>
