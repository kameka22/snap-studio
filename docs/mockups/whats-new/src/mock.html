  <nav class="side-nav">

        <button class="side-item"><span class="glyph" style="color:#FFCC00"><svg viewBox="0 0 24 24"><path d="m12 3.2 2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/></svg></span><span class="lbl">Favoris</span><span class="count">1</span></button>

    </div>
    <div class="side-block">

      <div class="side-group side-sub">
        <button class="side-item"><span class="glyph" style="color:#AF52DE"><svg viewBox="0 0 24 24"><path d="M12 2.5 14 8l5.5 2-5.5 2-2 5.5L10 12 4.5 10 10 8z"/></svg></span><span class="lbl">Une maille marine de 16 mm</span></button>
        <button class="side-item"><span class="glyph" style="color:#AF52DE"><svg viewBox="0 0 24 24"><path d="M12 2.5 14 8l5.5 2-5.5 2-2 5.5L10 12 4.5 10 10 8z"/></svg></span><span class="lbl">Support de bobine mural</span></button>

    </div>
    <div class="side-block">
      <button class="side-item"><span class="glyph" style="color:#007AFF"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="lbl">Fichiers</span></button>

        <button class="side-item"><span class="glyph" style="color:#8E8E93"><svg viewBox="0 0 24 24"><path d="M21.7 18.3 13.4 10A5.5 5.5 0 0 0 6.2 3l3.3 3.3-2.3 2.3L3.9 5.3a5.5 5.5 0 0 0 7 7.2l8.3 8.3a1.8 1.8 0 0 0 2.5-2.5"/></svg></span><span class="lbl">Entretien et réglages</span></button>

<main class="content"></main>
</div>
<script>
const q = new URLSearchParams(location.search);
const v = q.get("v") || "A";
if (q.get("scheme")) document.documentElement.dataset.scheme = q.get("scheme");
const S = (cls, fill) => `<svg class="${cls}" viewBox="0 0 24 24" fill="${fill}"><use href="#sparkle"/></svg>`;
const html = {
  A: `<button class="side-item wn-a ${q.get("on") ? "on" : ""}"><span class="glyph">${S("wn-sparkle", "url(#rb)")}</span><span class="lbl">Nouveautés</span><i class="wn-dot"></i></button>`,
  "A-seen": `<button class="side-item wn-a"><span class="glyph" style="color:#8E8E93">${S("wn-sparkle", "currentColor")}</span><span class="lbl">Nouveautés</span></button>`,
  B: `<button class="wn-card"><img src="assets/app-icon.png" alt=""><span class="t"><b>Nouveautés de la 0.14</b><span>Explorer et 3 autres</span></span><svg class="chev" viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></button>`,
  "B-seen": `<button class="side-item"><span class="glyph" style="color:#8E8E93">${S("wn-sparkle", "currentColor")}</span><span class="lbl">Nouveautés</span></button>`,
  C: `<div class="wn-c-row"><button class="wn-badge">v0.14 ${S("", "url(#rb)")}</button><span class="hint">Nouveautés</span></div>`,
  "C-seen": `<div class="wn-c-row"><button class="wn-badge seen">v0.14 ${S("", "currentColor")}</button></div>`,
};
document.getElementById("wn").innerHTML = html[v];
if (q.get("modal")) {
  document.querySelector(".window").insertAdjacentHTML("beforeend", `<div class="wn-dim"></div>
  <div class="wn-sheet">
    <div class="wn-sheet-bar">
      <span class="ttl">${S("", "url(#rb)")}Nouveautés</span>
      <span class="url"><span><svg viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 0 0 7 7v2H5v13h14V9zm-8 0V7a3 3 0 0 1 6 0v2z"/></svg>kameka22.github.io/snap-studio/nouveautes</span></span>
      <button class="wn-ib" title="Ouvrir dans le navigateur"><svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14zM5 5h6v2H5v12h12v-6h2v8H3V5z"/></svg></button>
      <button class="wn-ib close" title="Fermer"><svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>
    </div>
    <iframe src="../site/whats-new.html?embed=1"></iframe>
  </div>`);
}
</script>
